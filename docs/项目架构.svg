<rect x="49" y="764" width="5" height="55" rx="2" fill="#116E68" stroke="none"/>
<text x="75" y="791" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#116E68">导入一款壁纸</text>
<text x="76" y="826" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#485B60">文件夹 → 校验清单和资源 → 隔离播放器试播</text>
<text x="76" y="864" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#16282D">试播成功后发布到壁纸库；更新时保留可回退的版本。</text>
<text x="76" y="905" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#485B60">支持的作者包后端：精灵图集、Effekseer。</text>
<rect x="753" y="743" width="699" height="199" rx="18" fill="#FFFFFF" stroke="#CFD7D3"/>
<rect x="754" y="764" width="5" height="55" rx="2" fill="#235782" stroke="none"/>
<text x="780" y="791" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#235782">本地资源与状态</text>
<text x="781" y="826" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#485B60">内置分发目录、自定义壁纸库和兼容旧库</text>
<text x="781" y="864" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#16282D">每包包含 manifest.json 及素材，可附 settings.json。</text>
<text x="781" y="905" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#485B60">data/ 保存应用偏好、键位校准和逐款壁纸参数。</text>
<text x="49" y="976" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#485B60">关闭控制台后，常驻播放器仍可接收按键并播放壁纸。</text></svg>