<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" role="img"><title>Action75 Wallpaper 项目架构</title><desc>控制台通过本机命名管道控制原生播放器。按键直接进入播放器，经校准映射和特效模拟后在键盘副屏显示。</desc>
<rect x="0" y="0" width="1500" height="1000" rx="0" fill="#F4F3EE" stroke="none"/>
<text x="48" y="84" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="49" font-weight="700" fill="#16282D">Action75 Wallpaper</text>
<text x="49" y="136" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#485B60">Windows 项目架构   /   当前源码</text>
<rect x="48" y="174" width="432" height="367" rx="18" fill="#FFFFFF" stroke="#CFD7D3"/>
<rect x="49" y="195" width="5" height="55" rx="2" fill="#116E68" stroke="none"/>
<text x="75" y="222" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#116E68">控制台</text>
<text x="76" y="257" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#485B60">Action75Manager.exe   ·   Rust / egui</text>
<text x="78" y="305" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="700" fill="#116E68">壁纸库与参数面板</text>
<text x="78" y="337" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#16282D">选壁纸、调前景与背景、加载可见封面</text>
<text x="78" y="391" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="700" fill="#116E68">设备、校准与性能监控</text>
<text x="78" y="423" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#16282D">选择输出屏和键盘，查看播放器用量</text>
<text x="78" y="487" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#485B60">后台任务队列提交请求、处理回执。</text>
<rect x="700" y="174" width="752" height="367" rx="18" fill="#FFFFFF" stroke="#CFD7D3"/>
<rect x="701" y="195" width="5" height="55" rx="2" fill="#235782" stroke="none"/>
<text x="727" y="222" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#235782">常驻播放器</text>
<text x="728" y="257" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#485B60">Action75Native.exe   ·   C++ / Win32 / Direct3D 11</text>
<text x="730" y="303" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="700" fill="#235782">命令分发与壁纸加载</text>
<text x="730" y="335" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#16282D">窗口线程处理切换和设置；候选壁纸通过首帧检查后生效。</text>
<text x="730" y="388" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="700" fill="#235782">特效与渲染</text>
<text x="730" y="420" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#16282D">精灵图集、程序化场景、Effekseer 粒子共用 D3D11 输出。</text>
<text x="730" y="487" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#485B60">播放器负责屏幕绑定、设备恢复、托盘和副屏鼠标保护。</text>
<text x="502" y="299" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="700" fill="#16282D">本机命名管道</text>
<text x="530" y="329" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#485B60">JSON 命令</text>
